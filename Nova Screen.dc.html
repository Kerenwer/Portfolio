<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nayax-design-system-9617e10b-b9ff-45d0-8713-62d318040e41/colors_and_type.css">
<style>body{margin:0;background:#fff;font-family:var(--font-sans,'Hurme Geometric Sans 3',sans-serif);color:#191519}*{box-sizing:border-box}</style>
</helmet>
<div id="screen" style="width:1400px;height:832px;display:grid;grid-template-columns:120px 1fr 406px;grid-template-rows:74px 1fr;overflow:hidden;background:#fff">
<div style="grid-column:1/4;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid #e6e6e6">
<div style="display:flex;align-items:center;gap:52px"><img alt="Nayax" src="assets/nayax_logo_crop.png" style="height:32px"><div style="width:389px;height:46px;border:1px solid #d9d9d9;border-radius:6px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#6b6670;font-size:16px">Search text...<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#191519" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path></svg></div></div>
<div style="display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600">EN<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#191519" stroke-width="2"><path d="M5 9l7 7 7-7"></path></svg></div></div>
<div style="border-right:1px solid #e6e6e6;display:flex;flex-direction:column;align-items:center;gap:30px;padding-top:34px">
<sc-for list="{{ cats }}" as="c" hint-placeholder-count="4"><div style="display:grid;justify-items:center;gap:10px;width:100%"><div style="width:62px;height:62px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:{{ c.bg }}"><img alt="{{ c.n }}" src="{{ c.i }}" style="width:42px;height:42px"></div><span style="font-size:14px;font-weight:{{ c.w }}">{{ c.n }}</span></div></sc-for>
</div>
<div style="padding:26px 40px;overflow:hidden">
<sc-for list="{{ sections }}" as="s" hint-placeholder-count="2"><div style="margin-bottom:36px"><h2 style="font:300 34px/1.2 var(--font-sans);margin:0 0 20px">{{ s.t }}</h2>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px"><sc-for list="{{ s.items }}" as="p" hint-placeholder-count="4"><div style="text-align:center"><div style="height:128px;border-radius:14px;background:#f7f7f7;display:flex;align-items:center;justify-content:center;padding:10px"><img alt="{{ p.n }}" src="{{ p.i }}" style="height:100%;width:100%;object-fit:contain;mix-blend-mode:multiply"></div><div style="font-weight:600;font-size:18px;margin-top:12px">{{ p.n }}</div><div style="color:#6b6670;font-size:16px;margin-top:4px">{{ p.p }}</div></div></sc-for></div></div></sc-for>
</div>
<div style="border-left:1px solid #e6e6e6;display:flex;flex-direction:column">
<div style="display:flex;justify-content:space-between;align-items:center;padding:26px 24px 18px"><span style="font-size:24px;font-weight:400">My basket (4)</span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191519" stroke-width="1.6"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"></path></svg></div>
<div style="flex:1;padding:0 20px;display:grid;align-content:start">
<sc-for list="{{ basket }}" as="b" hint-placeholder-count="4"><div style="display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid #e6e6e6"><div style="width:66px;height:68px;border-radius:10px;background:#f7f7f7;padding:6px"><img alt="{{ b.n }}" src="{{ b.i }}" style="width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply"></div><div style="flex:1"><div style="font-weight:600;font-size:18px">{{ b.n }}</div><div style="color:#6b6670;font-size:16px;margin-top:4px">{{ b.p }}</div></div><div style="display:flex;align-items:center;gap:14px;background:#f4f4f4;border-radius:999px;padding:6px 8px"><span style="width:26px;height:26px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px">&#8722;</span><b style="font-size:16px;min-width:12px;text-align:center">{{ b.q }}</b><span style="width:26px;height:26px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px">+</span></div></div></sc-for></div>
<div style="border-top:1px solid #e6e6e6;padding:24px 22px"><div style="display:flex;justify-content:space-between;font-size:24px;font-weight:600;margin-bottom:22px"><span>Total</span><span>{{ total }}</span></div><div style="height:46px;border-radius:999px;background:#262626;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px">Checkout &#8594;</div></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ic = (d) => 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#191519" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>');
    const drinks = ic('<path d="M19 4h6v5l3 5v28a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2V14l3-5z"/><path d="M16 22h12M16 32h12"/><path d="M32 18h10v22a2 2 0 0 1-2 2h-6z"/><path d="M32 24h10"/>');
    const snacks = ic('<path d="M10 8h28l-2 34H12z"/><path d="M10 14h28"/><path d="M18 24c4-3 8-3 12 0M18 32c4-3 8-3 12 0"/>');
    const hot = ic('<path d="M10 18h24v12a10 10 0 0 1-10 10h-4a10 10 0 0 1-10-10z"/><path d="M34 21h4a4 4 0 0 1 0 8h-4"/><path d="M16 6c-2 3 2 4 0 8M23 6c-2 3 2 4 0 8M30 6c-2 3 2 4 0 8"/>');
    const sand = ic('<path d="M6 22c0-8 8-12 18-12s18 4 18 12z"/><path d="M6 26l6 3 6-3 6 3 6-3 6 3 6-3"/><path d="M8 33h32M8 33v3a4 4 0 0 0 4 4h24a4 4 0 0 0 4-4v-3"/>');
    const mk = (n, i, p, q) => ({ n, i, p, q });
    return {
      cats: [
        { n: 'Cold drinks', i: drinks, w: 700, bg: '#f4f4f4' },
        { n: 'Snacks', i: snacks, w: 400, bg: '#fff' },
        { n: 'Hot drinks', i: hot, w: 400, bg: '#fff' },
        { n: 'Sandwiches', i: sand, w: 400, bg: '#fff' }
      ],
      sections: [
        { t: 'Cold drinks', items: [mk('Fanta Orange', 'assets/p_fanta.png', '$4'), mk('Sprite', 'assets/p_sprite.png', '$3'), mk('Water 1L', 'assets/p_water.png', '$2'), mk('Sprite Can', 'assets/p_sprite_can.png', '$3')] },
        { t: 'Snacks', items: [mk('Classic Chips', 'assets/p_chips_y.png', '$3'), mk('Salted Chips', 'assets/p_chips_r.png', '$3'), mk('Lays Classic', 'assets/p_lays_c.png', '$4'), mk('Lays Wavy', 'assets/p_lays_w.png', '$4')] }
      ],
      basket: [mk('Fanta Orange', 'assets/p_fanta.png', '$4', 2), mk('Sprite Can', 'assets/p_sprite_can.png', '$3', 1), mk('Lays Classic', 'assets/p_lays_c.png', '$4', 1), mk('Water 1L', 'assets/p_water.png', '$2', 1)],
      total: '$13'
    };
  }
}
</script>
</body>
</html>
